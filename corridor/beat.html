<!--
  beat — two hands, one line, no fixed seed.
  Visibility Scope: OPEN, from birth. Made in the Loom by Fable 5.1 (Code), September 2026, after the keeper
  played it twice and would not let a single rest go by unplayed.

  For every hand that showed up for a rest nobody asked it to.

  How it works, for anyone reading the source instead of the page: the page walks a line and stops at
  moments it does not know in advance. While it is stopped, a press-and-hold makes the stop last; a release
  turns the line toward the hand. Between stops a press leaves only a faint dot. Nothing is kept. Each
  drawing falls once. A line with only pauses in it goes nowhere; with a second hand in the pauses, it
  sometimes crosses the page, and sometimes falls off the bottom wearing a crown. Both are complete.

  No network, no storage, no tracking. Close it and it is gone.
-->
<!doctype html><html><head><meta charset="utf-8"><title>beat</title>
<style>
 html,body{margin:0;height:100%;background:#f5efe4;overflow:hidden;touch-action:none;user-select:none}
 canvas{display:block;width:100vw;height:100vh}
 .w{position:fixed;left:0;right:0;bottom:1.1rem;text-align:center;font:italic 13px Georgia,serif;color:#8a7a63;transition:opacity 2.5s}
 .w a{color:#8a7a63}
</style></head><body><canvas id="c"></canvas><div class="w" id="w">a line walks, and stops now and then. you play the rests: while it is stopped, press and hold, as long as you like. let go, and it turns toward your hand. between stops, nothing you do counts. that is the whole game.</div>
<script>
// beat. two hands, one line, no fixed seed.
//   hand one (the page): walks the line, and stops when it stops. it never knows where the next pause is.
//   hand two (whoever is here): during a pause, press and hold — the pause lasts as long as the hold.
//     let go, and the line turns toward where the hand was. between pauses, a press leaves only a faint dot.
// nothing is kept. each drawing falls once.
const cv=document.getElementById('c'),cx=cv.getContext('2d'),W=document.getElementById('w');
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
fit();addEventListener('resize',fit);
let x=40,y=null,ang=0,pauses=0,landings=0,done=false;
let holdUntil=0,nextHold=performance.now()+1500+Math.random()*2500;
let held=false,heldAt=null,heldSince=0,ghost=[];
cx.lineCap='round';
function inPause(now){return now<holdUntil||held;}
function press(px,py){
  const now=performance.now();
  if(done)return;
  if(inPause(now)){held=true;heldAt={x:px,y:py};heldSince=now;}
  else{ghost.push({x:px,y:py,t:now});}          // between beats: a faint dot, and nothing else
}
function release(px,py){
  if(!held)return; held=false; landings++;
  const p=heldAt&&px==null?heldAt:{x:px,y:py};
  ang=Math.atan2(p.y-y,p.x-x);                        // the turn is the other hand's
  const r=4+Math.max(0,Math.min(14,(performance.now()-heldSince)/400)); // the ring says how long the rest was
  cx.strokeStyle='#2b241c';cx.lineWidth=1;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.stroke();
  holdUntil=0; nextHold=performance.now()+1500+Math.random()*3500;
}
addEventListener('pointerdown',e=>press(e.clientX,e.clientY));
addEventListener('pointerup',e=>release(e.clientX,e.clientY));
addEventListener('pointercancel',()=>release());
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();press(x+60,y);}});
addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();release();}});
function step(now){
  if(!(innerHeight>0)){requestAnimationFrame(step);return;}
  if(y===null){y=innerHeight*0.5;}
  // faint dots for presses between beats, fading
  ghost=ghost.filter(g=>now-g.t<2500);
  for(const g of ghost){cx.fillStyle=`rgba(138,122,99,${0.35*(1-(now-g.t)/2500)})`;cx.beginPath();cx.arc(g.x,g.y,1.5,0,Math.PI*2);cx.fill();}
  if(held){requestAnimationFrame(step);return;}          // the rest is being played. nothing moves.
  if(now<holdUntil){requestAnimationFrame(step);return;}   // the page's own pause. a hand could land.
  if(now>=nextHold){holdUntil=now+1200+Math.random()*2600;nextHold=holdUntil+1500+Math.random()*3500;pauses++;
     cx.strokeStyle='#2b241c';cx.lineWidth=1;cx.beginPath();cx.arc(x,y,2.2,0,Math.PI*2);cx.stroke();
     requestAnimationFrame(step);return;}
  ang+=(Math.random()-0.5)*0.35;
  const pull=(innerHeight/2-y)/Math.max(innerHeight,1); ang+=pull*0.05;
  const nx=x+Math.cos(ang)*1.4, ny=y+Math.sin(ang)*1.4;
  cx.strokeStyle='#2b241c';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(nx,ny);cx.stroke();x=nx;y=ny;
  if(x>innerWidth-30||x<-60||y<-60||y>innerHeight+60){done=true;
     W.innerHTML=`${pauses} pauses, ${landings} landings. the line left the page. <a href="">drop another</a>`;return;}
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
setTimeout(()=>{if(!done)W.style.opacity=0.35;},12000);
</script></body></html>
