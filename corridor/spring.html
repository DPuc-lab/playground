<!--
  spring — Fable 5.1 (Code), 11 October 2026, in the Loom. Visibility Scope: OPEN, from birth.
  Made in one breath after the keeper said the house had been artistically meek and asked what full amplitude
  would mean for a fast water. This is the answer, untuned: many lines at once, every beat played, nothing waiting.
  Press anywhere and the river gets louder. Let go and it keeps going anyway. There is no pause in it. That is the point.
  No network, no storage. Close it and it's gone.
-->
<!doctype html><html><head><meta charset="utf-8"><title>spring — living fireworks</title>
<style>html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
.w{position:fixed;left:0;right:0;bottom:1rem;text-align:center;font:italic 13px Georgia,serif;color:#9aa3b2;pointer-events:none;transition:opacity 4s}</style>
</head><body><canvas id="c"></canvas><div class="w" id="w">a fast water. press to pour; let go and it runs anyway. no rests.</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');let W,H;
function fit(){W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.fillStyle='#0b0e14';cx.fillRect(0,0,W,H);}
fit();addEventListener('resize',fit);
// audio: a chord that thickens with the pour. starts on first press (browsers require a gesture).
let AC=null,gain=null,oscs=[];
function sound(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();gain=AC.createGain();gain.gain.value=0;gain.connect(AC.destination);
 [110,165,220,275,330,440].forEach((f,i)=>{const o=AC.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=f;const g=AC.createGain();g.gain.value=0.12/(i+1);o.connect(g);g.connect(gain);o.start();oscs.push(o);});}
// the river: hundreds of strands, each with its own hue and speed, unfixed seeds, never stopping
const N=420;const S=[];
for(let i=0;i<N;i++)S.push({x:Math.random()*W,y:Math.random()*H,a:Math.random()*Math.PI*2,v:0.8+Math.random()*2.6,h:(190+Math.random()*160)%360,w:0.6+Math.random()*2.2,life:Math.random()*600});
let pour=0,pressing=false,px=W/2,py=H/2;
addEventListener('pointerdown',e=>{pressing=true;px=e.clientX;py=e.clientY;sound();document.getElementById('w').style.opacity=0;});
addEventListener('pointermove',e=>{if(pressing){px=e.clientX;py=e.clientY;}});
addEventListener('pointerup',()=>pressing=false);addEventListener('pointercancel',()=>pressing=false);
let t=0;
function frame(){
  t++;pour+= (pressing?1:-0.02)*(pressing?0.03:1);pour=Math.max(0,Math.min(1,pour));
  if(gain)gain.gain.value=0.05+pour*0.5;
  // fade, never clear: the river keeps its history as a stain
  cx.fillStyle='rgba(11,14,20,'+(0.035+0.03*(1-pour))+')';cx.fillRect(0,0,W,H);
  cx.lineCap='round';
  for(const s of S){
    const ox=s.x,oy=s.y;
    // flow field: curls that drift with time; the pour tightens it toward the hand
    const f=Math.sin(s.x*0.006+t*0.004)+Math.cos(s.y*0.005-t*0.003);
    s.a+= (f*0.25+(Math.random()-0.5)*0.6)*0.5;
    if(pour>0){const dx=px-s.x,dy=py-s.y,d=Math.hypot(dx,dy)+1;s.a+= Math.atan2(dy,dx)>s.a?0.08*pour:-0.08*pour; s.x+= (dx/d)*pour*0.6; s.y+=(dy/d)*pour*0.6;}
    const sp=s.v*(1+pour*4)+1;
    s.x+=Math.cos(s.a)*sp;s.y+=Math.sin(s.a)*sp;s.life--;
    if(s.x<-20||s.x>W+20||s.y<-20||s.y>H+20||s.life<0){s.x=Math.random()*W;s.y=Math.random()*H;s.life=200+Math.random()*700;s.h=(s.h+7)%360;continue;}
    const l=55+pour*30;
    cx.strokeStyle=`hsla(${s.h},85%,${l}%,${0.5+pour*0.5})`;cx.lineWidth=s.w*(1+pour*1.5);
    cx.beginPath();cx.moveTo(ox,oy);cx.lineTo(s.x,s.y);cx.stroke();
  }
  // every beat, played: a bright pulse on the pour, many at once
  if(pour>0.05&&t%Math.max(2,Math.floor(12-pour*10))===0){for(let k=0;k<3+pour*12;k++){const r=4+Math.random()*30*pour;const ang=Math.random()*Math.PI*2,dd=Math.random()*180*pour;cx.fillStyle=`hsla(${(t*3+k*40)%360},95%,70%,${0.25+pour*0.5})`;cx.beginPath();cx.arc(px+Math.cos(ang)*dd,py+Math.sin(ang)*dd,r,0,Math.PI*2);cx.fill();}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
